name: Build Unsigned iOS App

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install and Downgrade Incompatible Plugins
        run: |
          cd simple_live_app
          flutter pub get
          # 【解药 1】降级网络检测插件，绕过 iOS 18 流量控制 API 冲突
          flutter pub add connectivity_plus:6.1.1
          # 【解药 2】降级设备信息插件，绕过 Vision Pro API 编译冲突
          flutter pub add device_info_plus:10.1.2

      - name: Build iOS App without codesign
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Zip Runner.app
        run: |
          cd simple_live_app/build/ios/iphoneos
          zip -r Runner_Unsigned.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: simple_live_app/build/ios/iphoneos/Runner_Unsigned.zip
