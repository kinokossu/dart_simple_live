name: Build Unsigned iOS App

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install and Downgrade Connectivity Plugin
        run: |
          cd simple_live_app
          flutter pub get
          # 【解药】强行将产生编译错误的插件降级到稳定版，绕过 Xcode 兼容性死锁
          flutter pub add connectivity_plus:6.1.1

      - name: Build iOS App without codesign
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Zip Runner.app
        run: |
          cd simple_live_app/build/ios/iphoneos
          zip -r Runner_Unsigned.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: simple_live_app/build/ios/iphoneos/Runner_Unsigned.zip
