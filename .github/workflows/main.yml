name: Build Unsigned iOS App

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install and Downgrade Incompatible Plugins
        run: |
          cd simple_live_app
          flutter pub get
          flutter pub add connectivity_plus:6.1.1
          flutter pub add device_info_plus:10.1.2

      - name: Build iOS App without codesign
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 【核心改动】直接在云端 Mac 上创建 Payload 并打包成绝对纯正的 .ipa 文件
      - name: Create Standard IPA File
        run: |
          cd simple_live_app/build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r simple_live_app.ipa Payload

      # 上传最终的 .ipa 文件
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-package
          path: simple_live_app/build/ios/iphoneos/simple_live_app.ipa
